<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 512px; height: 256px; margin: 0; overflow: hidden; background: transparent; }
    body { display: grid; place-items: center; font-family: 'Segoe UI', Arial, sans-serif; }
    .panel { position: relative; display: flex; align-items: center; gap: 24px; width: 450px; height: 170px; padding: 20px 28px; color: #f1f3f6; }
    .cards { position: relative; flex: 0 0 94px; height: 100px; }
    .card { position: absolute; top: 6px; width: 68px; height: 92px; border: 3px solid #fff; border-radius: 11px; box-shadow: 0 5px 12px #0008; }
    .card:nth-child(1) { left: 0; transform: rotate(-18deg); background: #248dd0; }
    .card:nth-child(2) { left: 16px; transform: rotate(-3deg); background: #f2c600; }
    .card:nth-child(3) { left: 32px; transform: rotate(13deg); background: #ed5145; }
    .card::after { content: ''; position: absolute; inset: 15px 8px; border: 3px solid #fff; border-radius: 50%; transform: rotate(-26deg); }
    .label { min-width: 0; text-shadow: 0 2px 3px #11171e, 0 0 8px #11171e; }
    strong { display: block; font-size: 30px; font-weight: 600; line-height: 1.2; letter-spacing: -.4px; white-space: nowrap; }
    small { display: flex; align-items: center; gap: 10px; margin-top: 10px; color: #e7ebf0; font-size: 22px; line-height: 1.3; font-weight: 600; white-space: nowrap; }
    kbd { display: inline-grid; place-items: center; flex: 0 0 34px; height: 34px; border: 1px solid #ff8098; border-radius: 5px; background: #ff4d6d; color: #fff; font: 700 25px/1 'Segoe UI', Arial, sans-serif; text-shadow: 0 1px 2px #11171e80; }
  </style>
</head>
<body><div class="panel"><div class="cards" aria-hidden="true"><div class="card"></div><div class="card"></div><div class="card"></div></div><div class="label"><strong id="title"></strong><small><kbd>E</kbd> <span id="hint"></span></small></div></div>
<script>
  window.addEventListener('message', ({ data }) => {
    if (typeof data?.title === 'string') document.getElementById('title').textContent = data.title;
    if (typeof data?.hint === 'string') document.getElementById('hint').textContent = data.hint;
  });
</script></body>
</html>
