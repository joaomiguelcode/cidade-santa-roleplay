<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Domination World Interaction</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
        }

        body.preview {
            display: grid;
            place-items: center;
            background-color: #071014;
            background-image:
                linear-gradient(45deg, rgba(255, 255, 255, 0.035) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255, 255, 255, 0.035) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.035) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.035) 75%);
            background-position: 0 0, 0 16px, 16px -16px, -16px 0;
            background-size: 32px 32px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        body.preview canvas {
            width: min(72vmin, 512px);
            height: min(72vmin, 512px);
        }

        body.preview.ranking-preview {
            display: block;
            padding: 30px;
            overflow: auto;
            background-color: #11171a;
            background-image:
                radial-gradient(circle at 50% 35%, rgba(91, 111, 118, 0.3), transparent 44%),
                linear-gradient(160deg, #1b2529, #0c1012 72%);
        }

        .ranking-preview-stage {
            display: contents;
        }

        body.ranking-preview .ranking-preview-stage {
            display: flex;
            width: max-content;
            min-width: 100%;
            min-height: calc(100vh - 60px);
            gap: 26px;
            align-items: center;
            justify-content: center;
        }

        body.ranking-mode canvas {
            display: none;
        }

        body.ranking-mode {
            display: grid;
            place-items: center;
        }

        .ranking-board {
            --ranking-accent-rgb: var(--rgb-color, 243, 123, 34);
            --ranking-accent: var(--main-500, #f37b22);
            --ranking-accent-bright: var(--main-300, #ffad4f);
            --ranking-accent-dark: var(--main-700, #bd4611);
            --ranking-accent-deep: var(--main-950, #411609);
            --ranking-background: var(--background-solid, #1f1004);
            --ranking-surface: var(--background-solid, #1f1004);
            --ranking-border: var(--main-opacity-200, rgba(243, 123, 34, 0.2));
            --ranking-text: var(--grey-100, #f7eee7);
            --ranking-muted: var(--white-opacity-500, #b8a79b);
            position: relative;
            display: none;
            width: min(63vw, 540px);
            height: min(86vh, 740px);
            min-height: 640px;
            padding: 34px 34px 30px;
            overflow: hidden;
            color: var(--ranking-text);
            font-family: Inter, Arial, sans-serif;
            background: transparent;
            filter:
                drop-shadow(0 18px 34px rgba(3, 2, 1, 0.68))
                drop-shadow(0 0 9px rgba(var(--ranking-accent-rgb), 0.24));
            flex-direction: column;
            gap: 16px;
            isolation: isolate;
        }

        .ranking-board::before,
        .ranking-board::after {
            position: absolute;
            content: "";
            pointer-events: none;
            clip-path: polygon(5% 0, 94% 1%, 100% 7%, 98% 93%, 93% 100%, 7% 98%, 0 92%, 2% 8%);
        }

        .ranking-board::before {
            inset: 0;
            z-index: -2;
            background: linear-gradient(
                145deg,
                var(--ranking-accent-bright),
                var(--ranking-accent-dark) 42%,
                var(--ranking-accent) 72%,
                var(--ranking-accent-deep)
            );
        }

        .ranking-board::after {
            inset: 5px;
            z-index: -1;
            background:
                radial-gradient(circle at 50% 0, rgba(var(--ranking-accent-rgb), 0.14), transparent 35%),
                linear-gradient(168deg, rgba(255, 255, 255, 0.035), rgba(0, 0, 0, 0.38) 78%),
                var(--ranking-background);
            clip-path: polygon(5% 0, 94% 1%, 100% 7%, 98% 93%, 93% 100%, 7% 98%, 0 92%, 2% 8%);
        }

        body.ranking-mode.ranking-visible.ranking-scope-organizations #ranking-board,
        body.ranking-mode.ranking-visible.ranking-scope-players #player-ranking-board,
        body.ranking-preview.ranking-visible #ranking-board,
        body.ranking-preview.ranking-visible #player-ranking-board {
            display: flex;
        }

        .ranking-board > :not(.ranking-edge-flare):not(.ranking-banner) {
            position: relative;
            z-index: 1;
        }

        .ranking-banner {
            position: absolute;
            z-index: 0;
            top: 5px;
            right: 5px;
            left: 5px;
            height: 210px;
            overflow: hidden;
            pointer-events: none;
            opacity: 1;
            clip-path: polygon(27px 0, calc(100% - 32px) 7px, 100% 52px, calc(100% - 5px) 100%, 8px 100%, 11px 59px);
            -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 28%, rgba(0, 0, 0, 0.7) 48%, transparent 78%);
            mask-image: linear-gradient(to bottom, #000 0%, #000 28%, rgba(0, 0, 0, 0.7) 48%, transparent 78%);
        }

        .ranking-banner[hidden] {
            display: none;
        }

        .ranking-banner img {
            display: block;
            width: 180%;
            height: auto;
            margin-left: -40%;
            opacity: 1;
            filter: saturate(0.86) contrast(1.08) brightness(0.78);
            -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 48%, rgba(0, 0, 0, 0.72) 68%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0%, #000 48%, rgba(0, 0, 0, 0.72) 68%, transparent 100%);
        }

        .ranking-banner::after {
            position: absolute;
            inset: 0;
            content: "";
            background:
                linear-gradient(90deg, rgba(0, 0, 0, 0.44), rgba(0, 0, 0, 0.1) 50%, rgba(0, 0, 0, 0.44)),
                linear-gradient(180deg, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.58) 46%, transparent 100%);
        }

        .ranking-edge-flare {
            position: absolute;
            z-index: 2;
            top: 31%;
            width: 26px;
            height: 26px;
            pointer-events: none;
            background: var(--ranking-accent-bright);
            box-shadow:
                0 0 9px rgba(var(--ranking-accent-rgb), 0.88),
                0 0 20px rgba(var(--ranking-accent-rgb), 0.52);
            clip-path: polygon(50% 0, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0 50%, 39% 38%);
        }

        .ranking-edge-flare--left {
            left: 1px;
            transform: translate(-50%, -50%);
        }

        .ranking-edge-flare--right {
            right: 1px;
            transform: translate(50%, -50%);
        }

        .ranking-heading {
            display: flex;
            min-height: 68px;
            padding: 0 10px;
            align-items: center;
            text-shadow: 0 2px 5px rgba(10, 5, 2, 0.88);
        }

        .ranking-kicker {
            display: flex;
            margin-bottom: 4px;
            color: var(--ranking-accent);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            align-items: center;
            gap: 8px;
        }

        .ranking-kicker::before {
            width: 18px;
            height: 3px;
            content: "";
            background: var(--ranking-accent);
            transform: skewX(-28deg);
        }

        .ranking-heading h1 {
            margin: 0;
            font-size: 29px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.045em;
            text-transform: uppercase;
            transform: rotate(-0.5deg);
        }

        .ranking-heading h1 strong {
            color: var(--ranking-accent);
            font-weight: 650;
        }

        .ranking-filters {
            display: flex;
            padding: 0 6px;
            gap: 8px;
        }

        .ranking-filter {
            min-width: 0;
            min-height: 40px;
            padding: 0 13px;
            color: var(--ranking-muted);
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--ranking-border);
            border-radius: 999px;
            outline: none;
            background: rgba(0, 0, 0, 0.38);
            flex: 1;
            transition:
                transform 160ms cubic-bezier(0.22, 1, 0.36, 1),
                color 120ms ease,
                border-color 120ms ease,
                background-color 120ms ease;
        }

        .ranking-filter:hover,
        .ranking-filter:focus-visible {
            color: var(--ranking-text);
            border-color: rgba(var(--ranking-accent-rgb), 0.55);
            transform: translateY(-2px);
        }

        .ranking-filter[aria-pressed="true"] {
            color: var(--ranking-accent-bright);
            border-color: var(--ranking-accent-bright);
            background: rgba(var(--ranking-accent-rgb), 0.13);
            box-shadow:
                inset 0 0 0 1px rgba(var(--ranking-accent-rgb), 0.12),
                0 0 10px rgba(var(--ranking-accent-rgb), 0.16);
        }

        .ranking-podium {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            min-height: 166px;
            padding: 12px 5px 0;
            gap: 9px;
            align-items: end;
        }

        .ranking-podium-card {
            --rank-color: #83b9d4;
            --rank-border: rgba(131, 185, 212, 0.58);
            --rank-wash: rgba(131, 185, 212, 0.12);
            --rank-glow: rgba(131, 185, 212, 0.22);
            --rank-value-border: rgba(131, 185, 212, 0.34);
            position: relative;
            display: flex;
            min-width: 0;
            min-height: 144px;
            padding: 13px 10px 11px;
            border: 1px solid var(--rank-border);
            border-radius: 13px 13px 8px 8px;
            background:
                linear-gradient(180deg, var(--rank-wash), transparent 58%),
                linear-gradient(rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.18)),
                var(--ranking-surface);
            flex-direction: column;
            align-items: center;
            text-align: center;
            clip-path: polygon(5% 0, 94% 2%, 100% 8%, 98% 100%, 3% 98%, 0 7%);
        }

        .ranking-podium-card[data-rank="1"] {
            --rank-color: #ffbd4a;
            --rank-border: rgba(255, 189, 74, 0.64);
            --rank-wash: rgba(255, 189, 74, 0.14);
            --rank-glow: rgba(255, 189, 74, 0.24);
            --rank-value-border: rgba(255, 189, 74, 0.38);
            min-height: 162px;
            transform: translateY(-9px);
            box-shadow: 0 0 18px rgba(255, 166, 46, 0.11);
        }

        .ranking-podium-card[data-rank="3"] {
            --rank-color: #dc7952;
            --rank-border: rgba(220, 121, 82, 0.58);
            --rank-wash: rgba(220, 121, 82, 0.12);
            --rank-glow: rgba(220, 121, 82, 0.22);
            --rank-value-border: rgba(220, 121, 82, 0.34);
        }

        .ranking-place {
            position: absolute;
            top: 57px;
            left: 50%;
            display: grid;
            min-width: 26px;
            height: 24px;
            padding: 0 5px;
            color: #231208;
            font-size: 11px;
            font-weight: 850;
            background: var(--rank-color);
            border: 2px solid #221006;
            border-radius: 999px;
            transform: translateX(-50%);
            place-items: center;
            z-index: 2;
        }

        .ranking-mark {
            display: grid;
            width: 52px;
            height: 52px;
            margin: 3px 0 13px;
            color: var(--ranking-text);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.04em;
            border: 2px solid var(--rank-color);
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 28%, var(--rank-glow), transparent 48%),
                var(--ranking-background);
            box-shadow: 0 0 13px var(--rank-glow);
            place-items: center;
        }

        .ranking-mark-fallback,
        .ranking-mark img {
            width: 100%;
            height: 100%;
            border-radius: inherit;
            grid-area: 1 / 1;
        }

        .ranking-mark-fallback {
            display: grid;
            place-items: center;
        }

        .ranking-mark img {
            display: block;
            object-fit: cover;
            background: var(--ranking-background);
        }

        .ranking-organization-name {
            width: 100%;
            overflow: hidden;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ranking-podium-value {
            margin-top: auto;
            min-width: 78%;
            padding: 5px 7px;
            color: var(--rank-color);
            font-size: 12px;
            font-weight: 750;
            border: 1px solid var(--rank-value-border);
            border-radius: 6px;
            background: rgba(7, 4, 2, 0.28);
        }

        .ranking-list-section {
            display: flex;
            min-height: 0;
            flex: 1;
            flex-direction: column;
        }

        .ranking-list-heading {
            display: flex;
            min-height: 32px;
            padding: 0 8px;
            color: var(--ranking-muted);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            align-items: center;
            justify-content: space-between;
        }

        .ranking-scroll-hint {
            color: rgba(170, 162, 155, 0.72);
            font-size: 9px;
            letter-spacing: 0.04em;
            text-transform: none;
        }

        .ranking-list {
            display: flex;
            min-height: 0;
            padding: 3px 7px 5px;
            overflow-x: hidden;
            overflow-y: auto;
            outline: none;
            flex-direction: column;
            gap: 7px;
            scrollbar-color: rgba(var(--ranking-accent-rgb), 0.75) rgba(255, 255, 255, 0.035);
            scrollbar-width: thin;
        }

        .ranking-list::-webkit-scrollbar {
            width: 4px;
        }

        .ranking-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.035);
        }

        .ranking-list::-webkit-scrollbar-thumb {
            background: rgba(var(--ranking-accent-rgb), 0.75);
            border-radius: 999px;
        }

        .ranking-row {
            display: grid;
            min-height: 52px;
            padding: 7px 11px 7px 7px;
            border: 1px solid var(--ranking-border);
            border-radius: 8px;
            background:
                linear-gradient(rgba(255, 255, 255, 0.025), rgba(0, 0, 0, 0.08)),
                var(--ranking-surface);
            grid-template-columns: 32px 38px minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            transform: rotate(-0.12deg);
            transition:
                transform 160ms cubic-bezier(0.22, 1, 0.36, 1),
                border-color 120ms ease,
                background-color 120ms ease;
        }

        .ranking-row:nth-child(even) {
            transform: rotate(0.12deg);
        }

        .ranking-row:hover {
            border-color: rgba(var(--ranking-accent-rgb), 0.42);
            background:
                linear-gradient(rgba(var(--ranking-accent-rgb), 0.12), rgba(var(--ranking-accent-rgb), 0.12)),
                var(--ranking-surface);
            transform: translateX(3px);
        }

        .ranking-row-place {
            color: var(--ranking-accent);
            font-size: 13px;
            font-weight: 800;
            text-align: center;
        }

        .ranking-row .ranking-mark {
            --rank-color: rgba(var(--ranking-accent-rgb), 0.68);
            width: 32px;
            height: 32px;
            margin: 0;
            font-size: 9px;
            border-width: 1px;
        }

        .ranking-row-name {
            min-width: 0;
            overflow: hidden;
            font-size: 13px;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ranking-row-value {
            color: var(--ranking-text);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .ranking-current {
            display: grid;
            min-height: 58px;
            margin: 0 7px 4px;
            padding: 8px 13px;
            border: 1px solid var(--ranking-accent-bright);
            border-radius: 8px;
            background:
                linear-gradient(90deg, rgba(var(--ranking-accent-rgb), 0.14), transparent 72%),
                var(--ranking-surface);
            box-shadow: 0 0 13px rgba(var(--ranking-accent-rgb), 0.1);
            grid-template-columns: 34px minmax(0, 1fr) auto;
            gap: 11px;
            align-items: center;
            transform: rotate(-0.1deg);
        }

        .ranking-current[hidden] {
            display: none;
        }

        .ranking-current-position {
            color: var(--ranking-accent-bright);
            font-size: 13px;
            font-weight: 850;
            text-align: center;
        }

        .ranking-current-copy {
            min-width: 0;
        }

        .ranking-current-label {
            display: block;
            margin-bottom: 3px;
            color: var(--ranking-accent);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .ranking-current-name {
            display: block;
            overflow: hidden;
            font-size: 13px;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ranking-current-value {
            color: var(--ranking-text);
            font-size: 12px;
            font-weight: 750;
            white-space: nowrap;
        }

        .ranking-current--player {
            grid-template-columns: 34px 36px minmax(0, 1fr) auto;
            gap: 9px;
        }

        .ranking-current--player .ranking-mark {
            --rank-color: var(--ranking-accent-bright);
            width: 34px;
            height: 34px;
            margin: 0;
            border-width: 1px;
        }

        .ranking-board--players .ranking-filter {
            padding-inline: 8px;
            font-size: 11px;
        }

        @media (max-height: 700px) {
            .ranking-board {
                height: min(92vh, 660px);
                min-height: 570px;
                padding: 27px 30px 24px;
                gap: 11px;
            }

            .ranking-podium {
                min-height: 146px;
            }

            .ranking-podium-card {
                min-height: 126px;
            }

            .ranking-podium-card[data-rank="1"] {
                min-height: 142px;
            }
        }
    </style>
</head>
<body>
    <canvas id="capture-point" width="1024" height="1024"></canvas>

    <main class="ranking-preview-stage">
    <section id="ranking-board" class="ranking-board" aria-label="Ranking de organizações da Dominação">
        <div id="ranking-banner" class="ranking-banner" aria-hidden="true" hidden>
            <img id="ranking-banner-image" alt="">
        </div>
        <span class="ranking-edge-flare ranking-edge-flare--left" aria-hidden="true"></span>
        <span class="ranking-edge-flare ranking-edge-flare--right" aria-hidden="true"></span>

        <header class="ranking-heading">
            <div>
                <span id="ranking-kicker" class="ranking-kicker">Dominação</span>
                <h1><span id="ranking-title">Ranking</span> <strong>/ <span id="ranking-organizations">Organizações</span></strong></h1>
            </div>
        </header>

        <nav class="ranking-filters" aria-label="Filtros do ranking">
            <button id="ranking-filter-general" class="ranking-filter" type="button" data-ranking-filter="points" aria-pressed="true">Geral</button>
            <button id="ranking-filter-kills" class="ranking-filter" type="button" data-ranking-filter="kills" aria-pressed="false">Abates</button>
            <button id="ranking-filter-captures" class="ranking-filter" type="button" data-ranking-filter="captures" aria-pressed="false">Capturas</button>
            <button id="ranking-filter-control" class="ranking-filter" type="button" data-ranking-filter="controlTimeSeconds" aria-pressed="false">Controle</button>
        </nav>

        <div id="ranking-podium" class="ranking-podium" aria-label="Três primeiras organizações"></div>

        <section class="ranking-list-section" aria-label="Classificação completa">
            <header class="ranking-list-heading">
                <span id="ranking-top-organizations">Top organizações</span>
                <span id="ranking-scroll-more" class="ranking-scroll-hint">Role para ver mais</span>
            </header>
            <div id="ranking-list" class="ranking-list" tabindex="0"></div>
        </section>

        <div id="ranking-current" class="ranking-current" aria-label="Sua organização"></div>
    </section>

    <section id="player-ranking-board" class="ranking-board ranking-board--players" aria-label="Ranking de jogadores da Dominação">
        <span class="ranking-edge-flare ranking-edge-flare--left" aria-hidden="true"></span>
        <span class="ranking-edge-flare ranking-edge-flare--right" aria-hidden="true"></span>

        <header class="ranking-heading">
            <div>
                <span id="player-ranking-kicker" class="ranking-kicker">Dominação</span>
                <h1><span id="player-ranking-title">Ranking</span> <strong>/ <span id="player-ranking-players">Jogadores</span></strong></h1>
            </div>
        </header>

        <nav id="player-ranking-filters" class="ranking-filters" aria-label="Filtros do ranking de jogadores">
            <button class="ranking-filter" type="button" data-player-ranking-filter="points" aria-pressed="true">Geral</button>
            <button class="ranking-filter" type="button" data-player-ranking-filter="kills" aria-pressed="false">Abates</button>
            <button class="ranking-filter" type="button" data-player-ranking-filter="assists" aria-pressed="false">Assist.</button>
            <button class="ranking-filter" type="button" data-player-ranking-filter="revives" aria-pressed="false">Revives</button>
            <button class="ranking-filter" type="button" data-player-ranking-filter="captures" aria-pressed="false">Capturas</button>
        </nav>

        <div id="player-ranking-podium" class="ranking-podium" aria-label="Três primeiros jogadores"></div>

        <section id="player-ranking-list-section" class="ranking-list-section" aria-label="Classificação completa dos jogadores">
            <header class="ranking-list-heading">
                <span id="player-ranking-top-players">Top jogadores</span>
                <span id="player-ranking-scroll-more" class="ranking-scroll-hint">Role para ver mais</span>
            </header>
            <div id="player-ranking-list" class="ranking-list" tabindex="0"></div>
        </section>

        <div id="player-ranking-current" class="ranking-current ranking-current--player" aria-label="Sua colocação"></div>
    </section>
    </main>

    <script>
        const LOGICAL_SIZE = 512;
        const requestedRenderScale = Number(new URLSearchParams(window.location.search).get("renderScale"));
        const RENDER_SCALE = requestedRenderScale === 1 ? 1 : 2;
        const FRAME_INTERVAL = 1000 / 15;
        const MODES = ["capture", "revive", "loot", "vehicle", "ranking"];
        const RANKING_THEME_CDN = "https://santaimagens.roleplayrp.com/img/themes";
        const RANKING_THEMES = new Set([
            "alexandria",
            "boomerang",
            "caravelas",
            "cidadenobre",
            "grande",
            "kingdom",
            "malta",
            "maresia",
            "real",
            "santa",
            "universo",
        ]);
        const RANKING_THEME_ALIASES = {
            nobre: "cidadenobre",
        };
        const RANKING_LOCALES = {
            ar: "ar-SA",
            "ar-sa": "ar-SA",
            de: "de-DE",
            "de-de": "de-DE",
            en: "en-US",
            "en-us": "en-US",
            es: "es-ES",
            "es-es": "es-ES",
            fr: "fr-FR",
            "fr-fr": "fr-FR",
            pt: "pt-BR",
            "pt-br": "pt-BR",
            "pt-pt": "pt-PT",
        };
        const DEFAULT_RANKING_LOCALIZATION = {
            locale: "pt-br",

        function clamp(value, minimum, maximum) {

        function polygonPath(ctx, centerX, centerY, radius, sides, rotation = 0) {
            ctx.beginPath();

            for (let index = 0; index < sides; index += 1) {
                const angle = rotation + (Math.PI * 2 * index) / sides;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;

                if (index === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            ctx.closePath();
        }

        function drawSegmentedRing(ctx, centerX, centerY, radius, color, phase, alpha) {
            const segments = 12;
            const segmentSize = Math.PI * 2 / segments;

            ctx.save();
            ctx.lineCap = "round";
            ctx.lineWidth = 5;
            ctx.strokeStyle = rgba(color, alpha);
            ctx.shadowColor = rgba(color, alpha * 0.75);
            ctx.shadowBlur = 12;

            for (let index = 0; index < segments; index += 1) {
                const start = phase + index * segmentSize;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, start, start + segmentSize * 0.53);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawFlag(ctx, centerX, centerY, size, color, controlled) {
            const left = centerX - size * 0.27;
            const top = centerY - size * 0.35;

            ctx.save();
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.lineWidth = controlled ? 8 : 7;
            ctx.strokeStyle = rgba(color, 0.98);
            ctx.fillStyle = rgba(color, controlled ? 0.34 : 0.16);
            ctx.shadowColor = rgba(color, 0.9);
            ctx.shadowBlur = 18;

            ctx.beginPath();
            ctx.moveTo(left, top);
            ctx.lineTo(left, centerY + size * 0.38);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(left + 2, top + 2);
            ctx.lineTo(centerX + size * 0.34, top + size * 0.08);
            ctx.lineTo(centerX + size * 0.2, centerY + size * 0.02);
            ctx.lineTo(left + 2, centerY - size * 0.05);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            if (controlled) {
                ctx.lineWidth = 7;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.94)";
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.moveTo(centerX - size * 0.05, centerY + size * 0.08);
                ctx.lineTo(centerX + size * 0.04, centerY + size * 0.17);
                ctx.lineTo(centerX + size * 0.23, centerY - size * 0.08);
                ctx.stroke();
            }

            ctx.restore();
        }

        // Zona em cooldown: ninguem captura, entao o ponto troca a bandeira pelo cadeado.
        // Corpo solido com a fechadura vazada e alca fina: le bem de longe e cabe com
        // folga no octogono interno (raio 55).
        function drawLock(ctx, centerX, centerY, size, color) {
            const bodyWidth = size * 0.36;
            const bodyHeight = size * 0.28;
            const shackleRadius = size * 0.1;
            const shackleRise = size * 0.05;
            const totalHeight = shackleRadius + shackleRise + bodyHeight;
            const shackleTop = centerY - totalHeight / 2;
            const bodyTop = shackleTop + shackleRadius + shackleRise;
            const bodyLeft = centerX - bodyWidth / 2;
            const corner = size * 0.045;

            ctx.save();
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.shadowColor = rgba(color, 0.85);
            ctx.shadowBlur = 14;

            ctx.lineWidth = 6.5;
            ctx.strokeStyle = rgba(color, 0.96);
            ctx.beginPath();
            ctx.moveTo(centerX - shackleRadius, bodyTop + 2);
            ctx.lineTo(centerX - shackleRadius, shackleTop + shackleRadius);
            ctx.arc(centerX, shackleTop + shackleRadius, shackleRadius, Math.PI, 0);
            ctx.lineTo(centerX + shackleRadius, bodyTop + 2);
            ctx.stroke();

            ctx.fillStyle = rgba(color, 0.94);
            ctx.beginPath();
            ctx.moveTo(bodyLeft + corner, bodyTop);
            ctx.lineTo(bodyLeft + bodyWidth - corner, bodyTop);
            ctx.quadraticCurveTo(bodyLeft + bodyWidth, bodyTop, bodyLeft + bodyWidth, bodyTop + corner);
            ctx.lineTo(bodyLeft + bodyWidth, bodyTop + bodyHeight - corner);
            ctx.quadraticCurveTo(bodyLeft + bodyWidth, bodyTop + bodyHeight, bodyLeft + bodyWidth - corner, bodyTop + bodyHeight);
            ctx.lineTo(bodyLeft + corner, bodyTop + bodyHeight);
            ctx.quadraticCurveTo(bodyLeft, bodyTop + bodyHeight, bodyLeft, bodyTop + bodyHeight - corner);
            ctx.lineTo(bodyLeft, bodyTop + corner);
            ctx.quadraticCurveTo(bodyLeft, bodyTop, bodyLeft + corner, bodyTop);
            ctx.closePath();
            ctx.fill();

            // Fechadura vazada na cor do fundo do octogono interno.
            const keyholeY = bodyTop + bodyHeight * 0.44;
            ctx.shadowBlur = 0;
            ctx.fillStyle = "rgba(4, 16, 21, 0.92)";
            ctx.beginPath();
            ctx.arc(centerX, keyholeY, size * 0.032, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(centerX - size * 0.016, keyholeY);
            ctx.lineTo(centerX + size * 0.016, keyholeY);
            ctx.lineTo(centerX + size * 0.022, keyholeY + bodyHeight * 0.32);
            ctx.lineTo(centerX - size * 0.022, keyholeY + bodyHeight * 0.32);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawCapturing(ctx, centerX, centerY, size, color, time) {

            if (mode === "vehicle") {
                reviveStatus = "holding";
                reviveDurationMs = isAbandonedVehiclePreview ? 15000 : 5000;
                reviveProgress = (time % (reviveDurationMs + 1000)) / reviveDurationMs;
                reviveStartedAt = time;
                return;
            }
            const cycle = time % 7200;

            if (cycle < 1400) {
                reviveStatus = "idle";
                reviveProgress = 0;
                return;
            }

            if (cycle < 5200) {
                reviveStatus = "holding";
                reviveProgress = (cycle - 1400) / 3800;
                reviveStartedAt = time;
                return;
            }

            reviveStatus = "complete";
            reviveProgress = 1;
        }

        function drawRevivePrompt(time) {
            context.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, 0);
            context.clearRect(0, 0, LOGICAL_SIZE, LOGICAL_SIZE);

            if (!visible) {
                return;
            }

            const centerX = LOGICAL_SIZE / 2;
            const vehicleWarning = mode === "vehicle";
            const centerY = vehicleWarning ? 205 : LOGICAL_SIZE / 2;
            const color = vehicleWarning ? [232, 235, 239] : isPreview
                ? (mode === "loot" ? LOOT_COLOR : REVIVE_COLOR)
                : [255, 255, 255];
            const progress = getReviveProgress(time);
            const holding = reviveStatus === "holding";
            const complete = !vehicleWarning && reviveStatus === "complete";
            const breath = 0.5 + Math.sin(time * 0.004) * 0.5;
            const phase = (time * 0.00052) % (Math.PI * 2);

            context.save();
            const glow = context.createRadialGradient(centerX, centerY, 20, centerX, centerY, 206);
            glow.addColorStop(0, rgba(color, complete ? 0.24 : 0.14 + breath * 0.05));
            glow.addColorStop(0.55, rgba(color, complete ? 0.1 : 0.055));
            glow.addColorStop(1, rgba(color, 0));
            context.fillStyle = glow;
            context.fillRect(38, 38, 436, 436);
            context.restore();

            drawSegmentedRing(context, centerX, centerY, 176, color, phase, complete ? 0.82 : 0.42);

            context.save();
            context.lineCap = "round";
            context.lineWidth = 12;
            context.strokeStyle = rgba(color, 0.16);
            context.beginPath();
            context.arc(centerX, centerY, 137, 0, Math.PI * 2);
            context.stroke();

            if (progress > 0) {
                context.strokeStyle = rgba(color, complete ? 1 : 0.94);
                context.shadowColor = rgba(color, complete ? 0.92 : 0.74);
                context.shadowBlur = complete ? 24 : 16;
                context.beginPath();
                context.arc(
                    centerX,
                    centerY,
                    137,
                    -Math.PI / 2,
                    -Math.PI / 2 + Math.PI * 2 * progress
                );
                context.stroke();
            }
            context.restore();

            context.save();
            context.fillStyle = "rgba(4, 16, 21, 0.9)";
            context.strokeStyle = rgba(color, complete ? 0.92 : 0.62 + breath * 0.12);
            context.lineWidth = complete ? 5 : 4;
            context.shadowColor = rgba(color, complete ? 0.88 : 0.48);
            context.shadowBlur = complete ? 25 : 15;
            polygonPath(context, centerX, centerY, 82 + breath * 2, 8, Math.PI / 8);
            if (!vehicleWarning) {
                context.fill();
            }
            context.stroke();
            context.restore();

            if (vehicleWarning) {
                const seconds = Math.max(0, Math.ceil((1 - progress) * reviveDurationMs / 1000));
                context.save();
                context.textAlign = "center";
                context.textBaseline = "middle";
                context.fillStyle = "#f0f1f2";
                context.font = "900 100px Inter, Arial, sans-serif";
                context.fillText(String(seconds), centerX, centerY + 1);
                context.fillStyle = rgba(color, 1);
                context.font = "900 34px Inter, Arial, sans-serif";
                context.fillText(vehicleLocalization.title, centerX, 431, 480);
                context.fillStyle = "#f0f1f2";
                context.font = "700 28px Inter, Arial, sans-serif";
                context.fillText(vehicleLocalization.hint, centerX, 474, 480);
                context.restore();
                return;
            }

            if (complete) {
                drawCheck(context, centerX, centerY, 88, color);
                return;
            }

            if (mode === "loot") {
                drawLootBag(context, centerX, centerY - 5, holding ? 66 : 62, color, holding ? 1 : 0.84);
            } else {
                drawMedicalCross(context, centerX, centerY - 8, holding ? 60 : 56, color, holding ? 1 : 0.82);
            }

            drawKeyBadge(context, centerX + 61, centerY + 61, color, holding);
        }

        function drawCapturePoint(time) {
            context.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, 0);
            context.clearRect(0, 0, LOGICAL_SIZE, LOGICAL_SIZE);

            if (!visible) {
                return;
            }

            const centerX = LOGICAL_SIZE / 2;
            const centerY = LOGICAL_SIZE / 2;
            const color = isPreview ? STATE_COLORS[state] : [255, 255, 255];
            // Cooldown: zona travada, entao aneis e octogono param de girar/pulsar.
            const frozen = state === "cooldown";
            const breath = frozen ? 0.3 : 0.5 + Math.sin(time * 0.0034) * 0.5;
            const phase = frozen ? Math.PI / 24 : (time * 0.0007) % (Math.PI * 2);

            context.save();
            const glow = context.createRadialGradient(centerX, centerY, 24, centerX, centerY, 205);
            glow.addColorStop(0, rgba(color, 0.18 + breath * 0.05));
            glow.addColorStop(0.58, rgba(color, 0.07));
            glow.addColorStop(1, rgba(color, 0));
            context.fillStyle = glow;
            context.fillRect(42, 42, 428, 428);
            context.restore();

            drawSegmentedRing(context, centerX, centerY, 177, color, phase, frozen ? 0.42 : 0.67);
            drawSegmentedRing(context, centerX, centerY, 139, color, -phase * 0.72, frozen ? 0.26 : 0.42);

            context.save();
            context.lineWidth = 3;
            context.strokeStyle = rgba(color, 0.44);
            context.setLineDash([7, 10]);
            context.lineDashOffset = frozen ? 0 : -time * 0.018;
            context.beginPath();
            context.arc(centerX, centerY, 105, 0, Math.PI * 2);
            context.stroke();
            context.restore();

            context.save();
            context.shadowColor = rgba(color, 0.95);
            context.shadowBlur = 24;
            context.fillStyle = rgba(color, 0.2 + breath * 0.05);
            context.strokeStyle = rgba(color, 0.9);
            context.lineWidth = 4;
            polygonPath(context, centerX, centerY, 73 + breath * 2, 8, Math.PI / 8);
            context.fill();
            context.stroke();
            context.restore();

            context.save();
            context.fillStyle = "rgba(4, 16, 21, 0.82)";
            context.strokeStyle = rgba(color, 0.5);
            context.lineWidth = 2;
            polygonPath(context, centerX, centerY, 55, 8, Math.PI / 8);
            context.fill();
            context.stroke();
            context.restore();

            if (state === "capturing") {
                drawCapturing(context, centerX, centerY, 115, color, time);
            } else if (state === "contested") {
                drawContested(context, centerX, centerY, 115, color, time);
            } else if (state === "cooldown") {
                drawLock(context, centerX, centerY, 138, color);
            } else {
                drawFlag(context, centerX, centerY, 115, color, state === "controlled");
            }
        }

        function formatRankingValue(organization, filter) {
            if (filter === "controlTimeSeconds") {
                const totalMinutes = Math.floor(organization.controlTimeSeconds / 60);
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                const formattedHours = hours.toLocaleString(rankingLocale);
                const formattedMinutes = minutes.toLocaleString(rankingLocale, {
                    minimumIntegerDigits: 2,
                    useGrouping: false,
                });

                return `${formattedHours}${rankingLocalization.hoursShort} ${formattedMinutes}${rankingLocalization.minutesShort}`;
            }

            const formattedValue = Number(organization[filter] || 0).toLocaleString(rankingLocale);
            const suffix = filter === "points" ? rankingLocalization.pointsSuffix : "";
            return `${formattedValue}${suffix}`;
        }

        function createRankingMark(organization) {
            const mark = document.createElement("span");
            const fallback = document.createElement("span");
            const avatarUrl = getSafeRankingBannerUrl(organization.avatar);

            mark.className = "ranking-mark";
            fallback.className = "ranking-mark-fallback";
            fallback.textContent = organization.shortName || organization.name.slice(0, 2).toUpperCase();
            mark.setAttribute("aria-hidden", "true");
            mark.append(fallback);

            if (avatarUrl) {
                const avatar = document.createElement("img");

                avatar.alt = "";
                avatar.loading = "eager";
                avatar.src = avatarUrl;
                avatar.addEventListener("error", () => avatar.remove(), { once: true });
                mark.append(avatar);
            }

            return mark;
        }

        function createPodiumCard(organization, rank) {
            const card = document.createElement("article");
            const place = document.createElement("span");
            const name = document.createElement("span");
            const value = document.createElement("span");

            card.className = "ranking-podium-card";
            card.dataset.rank = String(rank);
            place.className = "ranking-place";
            place.textContent = `#${rank}`;
            name.className = "ranking-organization-name";
            name.textContent = organization.name;
            name.title = organization.name;
            value.className = "ranking-podium-value";
            value.textContent = formatRankingValue(organization, rankingFilter);

            card.append(place, createRankingMark(organization), name, value);
            return card;
        }

        function createRankingRow(organization, index) {
            const row = document.createElement("article");
            const place = document.createElement("span");
            const name = document.createElement("span");
            const value = document.createElement("span");
            const position = rankingFilter === "points" && organization.position > 0
                ? organization.position
                : index + 1;

            row.className = "ranking-row";
            place.className = "ranking-row-place";
            place.textContent = `#${position}`;
            name.className = "ranking-row-name";
            name.textContent = organization.name;
            name.title = organization.name;
            value.className = "ranking-row-value";
            value.textContent = formatRankingValue(organization, rankingFilter);

            row.append(place, createRankingMark(organization), name, value);
            return row;
        }

        function renderCurrentOrganization(organizations) {
            const currentIndex = organizations.findIndex((organization) => organization.isCurrent === true);
            const currentOrganization = organizations[currentIndex];

            rankingCurrent.replaceChildren();
            rankingCurrent.hidden = !currentOrganization;

            if (!currentOrganization) {
                return;
            }

            const position = document.createElement("span");
            const copy = document.createElement("span");
            const label = document.createElement("span");
            const name = document.createElement("span");
            const value = document.createElement("span");

            position.className = "ranking-current-position";
            position.textContent = `#${
                rankingFilter === "points" && currentOrganization.position > 0
                    ? currentOrganization.position
                    : currentIndex + 1
            }`;
            copy.className = "ranking-current-copy";
            label.className = "ranking-current-label";
            label.textContent = rankingLocalization.currentOrganization;
            name.className = "ranking-current-name";
            name.textContent = currentOrganization.name;
            value.className = "ranking-current-value";
            value.textContent = formatRankingValue(currentOrganization, rankingFilter);

            copy.append(label, name);
            rankingCurrent.append(position, copy, value);
        }

        function getSafeRankingBannerUrl(value) {
            if (!value) {
                return "";
            }

            try {
                const url = new URL(String(value));
                return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
            } catch (error) {
                return "";
            }
        }

        function renderRankingBanner() {
            const topOrganization = [...rankingOrganizations].sort((first, second) => (
                Number(second.points || 0) - Number(first.points || 0)
            ))[0];
            const bannerUrl = getSafeRankingBannerUrl(topOrganization?.banner);

            rankingBanner.hidden = !bannerUrl;

            if (!bannerUrl) {
                rankingBannerImage.removeAttribute("src");
                return;
            }

            rankingBannerImage.src = bannerUrl;
        }

        function renderRankingPreview() {
            const organizations = [...rankingOrganizations].sort((first, second) => {
                const metricDifference = Number(second[rankingFilter] || 0) - Number(first[rankingFilter] || 0);
                return metricDifference || second.points - first.points;
            });
            const podiumEntries = [
                { organization: organizations[1], rank: 2 },
                { organization: organizations[0], rank: 1 },
                { organization: organizations[2], rank: 3 },
            ].filter((entry) => entry.organization);

            rankingFilterButtons.forEach((button) => {
                button.setAttribute(
                    "aria-pressed",
                    String(button.dataset.rankingFilter === rankingFilter)
                );
            });

            rankingPodium.replaceChildren(
                ...podiumEntries.map((entry) => createPodiumCard(entry.organization, entry.rank))
            );
            rankingList.replaceChildren(
                ...organizations.map((organization, index) => (
                    createRankingRow(organization, index)
                ))
            );
            rankingList.scrollTop = 0;
            renderRankingBanner();
            renderCurrentOrganization(organizations);
        }

        function formatPlayerRankingValue(player, filter) {
            const formattedValue = Number(player[filter] || 0).toLocaleString(rankingLocale);
            const suffix = filter === "points" ? rankingLocalization.pointsSuffix : "";

            return `${formattedValue}${suffix}`;
        }

        function createPlayerPodiumCard(player, rank) {
            const card = document.createElement("article");
            const place = document.createElement("span");
            const name = document.createElement("span");
            const value = document.createElement("span");

            card.className = "ranking-podium-card";
            card.dataset.rank = String(rank);
            place.className = "ranking-place";
            place.textContent = `#${rank}`;
            name.className = "ranking-organization-name";
            name.textContent = player.name;
            name.title = player.name;
            value.className = "ranking-podium-value";
            value.textContent = formatPlayerRankingValue(player, playerRankingFilter);

            card.append(place, createRankingMark(player), name, value);
            return card;
        }

        function createPlayerRankingRow(player, index) {
            const row = document.createElement("article");
            const place = document.createElement("span");
            const name = document.createElement("span");
            const value = document.createElement("span");

            row.className = "ranking-row";
            place.className = "ranking-row-place";
            place.textContent = `#${
                playerRankingFilter === "points" && player.position > 0
                    ? player.position
                    : index + 1
            }`;
            name.className = "ranking-row-name";
            name.textContent = player.name;
            name.title = player.name;
            value.className = "ranking-row-value";
            value.textContent = formatPlayerRankingValue(player, playerRankingFilter);

            row.append(place, createRankingMark(player), name, value);
            return row;
        }

        function renderCurrentPlayer(players) {
            const currentIndex = players.findIndex((player) => player.isCurrent === true);
            const currentPlayer = players[currentIndex];

            playerRankingCurrent.replaceChildren();
            playerRankingCurrent.hidden = !currentPlayer;

            if (!currentPlayer) {
                return;
            }

            const position = document.createElement("span");
            const copy = document.createElement("span");
            const label = document.createElement("span");
            const name = document.createElement("span");
            const value = document.createElement("span");

            position.className = "ranking-current-position";
            position.textContent = `#${
                playerRankingFilter === "points" && currentPlayer.position > 0
                    ? currentPlayer.position
                    : currentIndex + 1
            }`;
            copy.className = "ranking-current-copy";
            label.className = "ranking-current-label";
            label.textContent = rankingLocalization.currentPlayer;
            name.className = "ranking-current-name";
            name.textContent = currentPlayer.name;
            value.className = "ranking-current-value";
            value.textContent = formatPlayerRankingValue(currentPlayer, playerRankingFilter);

            copy.append(label, name);
            playerRankingCurrent.append(
                position,
                createRankingMark(currentPlayer),
                copy,
                value
            );
        }

        function renderPlayerRanking() {
            const players = [...rankingPlayers].sort((first, second) => {
                const metricDifference = Number(second[playerRankingFilter] || 0)
                    - Number(first[playerRankingFilter] || 0);

                return metricDifference || second.points - first.points;
            });
            const podiumEntries = [
                { player: players[1], rank: 2 },
                { player: players[0], rank: 1 },
                { player: players[2], rank: 3 },
            ].filter((entry) => entry.player);

            playerRankingFilterButtons.forEach((button) => {
                button.setAttribute(
                    "aria-pressed",
                    String(button.dataset.playerRankingFilter === playerRankingFilter)
                );
            });
            playerRankingPodium.replaceChildren(
                ...podiumEntries.map((entry) => createPlayerPodiumCard(entry.player, entry.rank))
            );
            playerRankingList.replaceChildren(
                ...players.map((player, index) => createPlayerRankingRow(player, index))
            );
            playerRankingList.scrollTop = 0;
            renderCurrentPlayer(players);
        }

        rankingBannerImage.addEventListener("error", () => {
            rankingBanner.hidden = true;
        });

        function syncModePresentation() {
            const rankingVisible = mode === "ranking" && visible;

            document.body.classList.toggle("ranking-mode", mode === "ranking");
            document.body.classList.toggle("ranking-visible", rankingVisible);
            document.body.classList.toggle(
                "ranking-scope-organizations",
                rankingScope === "organizations"
            );
            document.body.classList.toggle("ranking-scope-players", rankingScope === "players");

            if (rankingVisible) {
                if (isRankingPreview) {
                    renderRankingPreview();
                    renderPlayerRanking();
                } else if (rankingScope === "players") {
                    renderPlayerRanking();
                } else {
                    renderRankingPreview();
                }
            }

            syncRenderLoop();
        }

        rankingFilterButtons.forEach((button) => {
            button.addEventListener("click", () => {
                const nextFilter = button.dataset.rankingFilter;

                if (!RANKING_FILTERS[nextFilter] || nextFilter === rankingFilter) {
                    return;
                }

                rankingFilter = nextFilter;
                renderRankingPreview();
            });
        });

        playerRankingFilterButtons.forEach((button) => {
            button.addEventListener("click", () => {
                const nextFilter = button.dataset.playerRankingFilter;

                if (!PLAYER_RANKING_FILTERS[nextFilter] || nextFilter === playerRankingFilter) {
                    return;
                }

                playerRankingFilter = nextFilter;
                renderPlayerRanking();
            });
        });

        syncModePresentation();

        function render(time) {
            animationFrameId = null;

            if (!visible || mode === "ranking") {
                return;
            }

            animationFrameId = requestAnimationFrame(render);

            if (time - lastFrameAt < FRAME_INTERVAL) {
                return;
            }

            lastFrameAt = time;

            if (mode === "revive" || mode === "loot" || mode === "vehicle") {
                if (isInteractionPreview) {
                    updateRevivePreview(time);
                }

                drawRevivePrompt(time);
                return;
            }

            if (isPreview && !requestedState) {
                state = STATES[Math.floor(time / 2600) % STATES.length];
            }

            drawCapturePoint(time);
        }

        function syncRenderLoop() {
            const shouldAnimate = visible && mode !== "ranking";

            if (shouldAnimate && animationFrameId === null) {
                animationFrameId = requestAnimationFrame(render);
                return;
            }

            if (!shouldAnimate && animationFrameId !== null) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }

        window.addEventListener("message", (event) => {
            const data = event.data || {};

            if (data.action === "setVisible") {
                visible = data.visible === true;
                syncModePresentation();

                if (!visible || mode === "ranking") {
                    return;
                }

                mode === "revive" || mode === "loot" || mode === "vehicle"
                    ? drawRevivePrompt(performance.now())
                    : drawCapturePoint(performance.now());
                return;
            }

            if (data.action === "setMode" && MODES.includes(data.mode)) {
                mode = data.mode;

                if (mode === "ranking") {
                    rankingScope = data.rankingScope === "players"
                        ? "players"
                        : "organizations";

                    if (typeof data.cityName === "string") {
                        setRankingTheme(data.cityName);
                    }

                    applyRankingLocalization(data.localization);
                }

                syncModePresentation();

                if (mode === "ranking") {
                    return;
                }

                mode === "revive" || mode === "loot" || mode === "vehicle"
                    ? drawRevivePrompt(performance.now())
                    : drawCapturePoint(performance.now());
                return;
            }

            if (data.action === "setRankingData" && Array.isArray(data.entries)) {
                if (data.rankingScope === "players") {
                    rankingPlayers = data.entries.map((player) => ({
                        name: String(player.name || rankingLocalization.defaultPlayer),
                        shortName: String(player.shortName || "").slice(0, 3),
                        avatar: String(player.avatar || ""),
                        position: Math.max(0, Number(player.position) || 0),
                        points: Number(player.points) || 0,
                        kills: Number(player.kills) || 0,
                        assists: Number(player.assists) || 0,
                        revives: Number(player.revives) || 0,
                        captures: Number(player.captures) || 0,
                        isCurrent: player.isCurrent === true,
                    }));
                    renderPlayerRanking();
                    return;
                }

                rankingOrganizations = data.entries.map((organization) => ({
                    name: String(organization.name || rankingLocalization.defaultOrganization),
                    shortName: String(organization.shortName || "").slice(0, 3),
                    banner: String(organization.banner || ""),
                    position: Math.max(0, Number(organization.position) || 0),
                    points: Number(organization.points) || 0,
                    kills: Number(organization.kills) || 0,
                    captures: Number(organization.captures) || 0,
                    controlTimeSeconds: Number(organization.controlTimeSeconds) || 0,
                    isCurrent: organization.isCurrent === true,
                }));
                renderRankingPreview();
                return;
            }

            if (data.action === "setState" && STATES.includes(data.state)) {
                mode = "capture";
                state = data.state;
                syncModePresentation();
                drawCapturePoint(performance.now());
                return;
            }

            if (data.action === "setInteraction") {
                const nextStatus = ["idle", "holding", "complete"].includes(data.status)
                    ? data.status
                    : "idle";

                mode = ["loot", "vehicle"].includes(data.mode) ? data.mode : "revive";
                if (mode === "vehicle" && data.localization) {
                    vehicleLocalization = {
                        title: String(data.localization.title || vehicleLocalization.title),
                        hint: String(data.localization.hint || vehicleLocalization.hint),
                    };
                }
                syncModePresentation();
                reviveStatus = nextStatus;
                reviveDurationMs = Math.max(250, Number(data.durationMs) || 3200);
                reviveProgress = clamp(Number(data.progress) || 0, 0, 1);
                reviveStartedAt = performance.now();
                drawRevivePrompt(reviveStartedAt);
                return;
            }

            if (data.action === "setRevive") {
                mode = "revive";
                syncModePresentation();
                reviveStatus = ["idle", "holding", "complete"].includes(data.status)
                    ? data.status
                    : "idle";
                reviveDurationMs = Math.max(250, Number(data.durationMs) || 3200);
                reviveProgress = clamp(Number(data.progress) || 0, 0, 1);
                reviveStartedAt = performance.now();
                drawRevivePrompt(reviveStartedAt);
            }
        });

    </script>
</body>
</html>
