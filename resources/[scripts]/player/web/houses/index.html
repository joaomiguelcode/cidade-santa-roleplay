<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mansao</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: Inter, "Segoe UI", Arial, sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: transparent;
            }

            body {
                display: grid;
                place-items: center;
            }

            .card {
                position: relative;
                display: none;
                width: 88%;
                min-height: 58%;
                padding: 54px 64px;
                overflow: hidden;
                border: 2px solid rgba(255, 220, 142, 0.62);
                border-radius: 16px;
                background:
                    radial-gradient(circle at 92% 4%, rgba(255, 184, 77, 0.24), transparent 38%),
                    linear-gradient(135deg, rgba(18, 18, 22, 0.96), rgba(7, 7, 10, 0.92));
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
            }

            .card::after {
                position: absolute;
                right: -72px;
                bottom: -142px;
                width: 340px;
                height: 340px;
                border: 1px solid rgba(255, 220, 142, 0.18);
                border-radius: 50%;
                content: "";
                box-shadow:
                    0 0 0 46px rgba(255, 220, 142, 0.04),
                    0 0 0 92px rgba(255, 220, 142, 0.025);
            }

            .emerald-art {
                position: absolute;
                z-index: 1;
                top: 34px;
                right: 34px;
                width: 340px;
                height: 240px;
                object-fit: contain;
                pointer-events: none;
                filter: drop-shadow(0 8px 8px rgba(10, 255, 62, 0.2));
            }

            .card.is-visible {
                display: block;
            }

            .eyebrow {
                position: relative;
                z-index: 2;
                margin: 0 0 10px;
                color: #e7bc70;
                font-size: 23px;
                font-weight: 750;
                letter-spacing: 0.22em;
                text-transform: uppercase;
            }

            .name {
                position: relative;
                z-index: 2;
                max-width: 560px;
                margin: 0;
                overflow: hidden;
                color: #fffaf0;
                font-size: 69px;
                font-weight: 800;
                letter-spacing: -0.04em;
                line-height: 1.02;
                text-overflow: ellipsis;
                text-shadow: 0 4px 24px rgba(0, 0, 0, 0.38);
                white-space: nowrap;
            }

            .price-row {
                position: relative;
                z-index: 2;
                display: flex;
                align-items: center;
                gap: 14px;
                margin-top: 34px;
            }

            .price {
                color: #72f078;
                font-size: 38px;
                font-weight: 800;
                letter-spacing: -0.02em;
            }

            .currency {
                color: rgba(215, 255, 218, 0.76);
                font-size: 22px;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }
        </style>
    </head>
    <body>
        <main class="card" id="card">
            <img class="emerald-art" src="emerald-pile.png" alt="" aria-hidden="true" />
            <p class="eyebrow" id="eyebrow"></p>
            <h1 class="name" id="name"></h1>
            <div class="price-row">
                <span class="price" id="price"></span>
                <span class="currency" id="currency"></span>
            </div>
        </main>

        <script>
            const card = document.getElementById("card");
            const name = document.getElementById("name");
            const price = document.getElementById("price");
            const eyebrow = document.getElementById("eyebrow");
            const currency = document.getElementById("currency");
            const formatter = new Intl.NumberFormat("pt-BR");

            function renderMansion(data) {
                name.textContent = data.name;
                price.textContent = formatter.format(data.gems);
                eyebrow.textContent = data.eyebrow;
                currency.textContent = data.currency;
                card.classList.add("is-visible");
            }

            window.addEventListener("message", (event) => {
                if (event.data?.action !== "houses:setMansion") return;

                renderMansion(event.data.data);
            });

            const params = new URLSearchParams(window.location.search);
            const duiKey = params.get("duiKey");
            const initialName = params.get("name");

            if (initialName) {
                renderMansion({
                    name: initialName,
                    gems: Number(params.get("gems")) || 0,
                    eyebrow: params.get("eyebrow") || "",
                    currency: params.get("currency") || "",
                });
            }

            fetch(`https://${GetParentResourceName()}/houses:ready`, {
                method: "POST",
                headers: { "Content-Type": "application/json; charset=UTF-8" },
                body: JSON.stringify({ duiKey }),
            });
        </script>
    </body>
</html>
