# CONEXÃO DO SERVIDOR
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# BANCO DE DADOS - MYSQL
set mysql_connection_string "server=127.0.0.1;uid=root;password=;database=cidadesanta;port=3306;charset=utf8mb4"
set mysql_transaction_isolation_level "2"
set mysql_slow_query_warning "500000"
set mysql_ui "true"

# CONFIGURAÇÕES DA CIDADE
setr cityName "Santa"
setr DevMode "false"
setr Whitelist "false"
setr Language "pt-br"

# IDENTIDADE DO SERVIDOR
sets tags ""
sets locale "pt-BR"
sets banner_detail "https://r2.fivemanage.com/68x4hbT3ut524pAfXfhcV/banner_santa02.png"
sets banner_connecting "https://r2.fivemanage.com/68x4hbT3ut524pAfXfhcV/connect_santa02.gif"

sv_hostname "[BRASIL]✅CIDADE SANTA ROLEPLAY #WIPE ONTEM!"
sets sv_projectName "CIDADE SANTA🡺WIPOU HJ 17-OUT🡸"
sets sv_projectDesc "ENTRE E GANHE UM CARRO. FACS E ORGS LIVRES. O MAIS OTIMIZADO DO BRASIL"

load_server_icon server.png

# LISTAGEM DO SERVIDOR
sv_master1 ""

# PERMISSÕES
add_ace group.admin command "allow"
add_ace group.admin command.quit "deny"
add_ace group.admin command.mysql "allow"
add_principal identifier.license:11462f7bb66a21f3b66102cb8a5ad97f09b5a323 "group.admin"

# CONFIGURAÇÕES DO SERVIDOR
sv_maxclients "1"
sv_scriptHookAllowed "false"

# ONESYNC (Ativado via start.bat com +set onesync on)
# set onesync "on"
set onesync_forceMigration "true"
set onesync_workaround763185 "true"
set onesync_distanceCullVehicles "true"
set onesync_population "false"

# GAME BUILD
set sv_enforceGameBuild "2944"
setr game_enableFlyThroughWindscreen "true"

# VOICE
setr voice_syncData "1"
setr voice_useNativeAudio "true"
setr voice_useSendingRangeOnly "true"

# AUTENTICAÇÃO
set steam_webApiKey "INSIRA_SEU_STEAM_WEB_API_KEY_AQUI" # https://steamcommunity.com/dev/apikey
sv_tebexSecret "INSIRA_SEU_TEBEX_SECRET_AQUI" # https://creator.tebex.io/game-servers
sv_licenseKey "INSIRA_SEU_CFX_LICENSE_KEY_AQUI" # https://portal.cfx.re/servers/registration-keys

# RECURSOS
ensure [system]
ensure sx
ensure vrp
ensure [scripts]
# ensure [addons]
